# CineJoy Remote — tag push (v*) builds the APK and attaches it to a GitHub Release.
# Signed release build when keystore secrets exist, debug build otherwise.
# Required secrets for signed builds (repo Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64, CINEJOY_KEYSTORE_PASSWORD, CINEJOY_KEY_ALIAS, CINEJOY_KEY_PASSWORD
name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses + install API 36
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.13

      - name: Restore release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: gradle :app:assembleRelease
        env:
          CINEJOY_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          CINEJOY_KEYSTORE_PASSWORD: ${{ secrets.CINEJOY_KEYSTORE_PASSWORD }}
          CINEJOY_KEY_ALIAS: ${{ secrets.CINEJOY_KEY_ALIAS }}
          CINEJOY_KEY_PASSWORD: ${{ secrets.CINEJOY_KEY_PASSWORD }}

      - name: Assemble debug APK (no keystore configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: gradle :app:assembleDebug

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/app-*.apk
          generate_release_notes: true
