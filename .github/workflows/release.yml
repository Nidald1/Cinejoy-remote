# CineJoy Remote — tag push (v*) builds the APK and attaches it to a GitHub Release.
# Signed release build when keystore secrets exist, debug build otherwise.
# Required secrets for signed builds (repo Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64, CINEJOY_KEYSTORE_PASSWORD, CINEJOY_KEY_ALIAS, CINEJOY_KEY_PASSWORD
# NOTE: keep all secrets references inside `env:`/`run:` (runtime). A secrets
# reference inside a step `if:` condition breaks workflow startup, so the
# release-vs-debug branch lives in bash below instead.
name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags must be present so the notes step can diff against the last
          # release.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android action: its default `packages: tools platform-tools`
      # references the long-removed `tools` package and fails. The runner image
      # already ships the SDK (ANDROID_HOME set) — install API 36 directly.
      - name: Accept SDK licenses + install API 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.13

      - name: Assemble APK (signed release when secrets exist, else debug)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            gradle :app:assembleRelease
          else
            gradle :app:assembleDebug
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CINEJOY_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          CINEJOY_KEYSTORE_PASSWORD: ${{ secrets.CINEJOY_KEYSTORE_PASSWORD }}
          CINEJOY_KEY_ALIAS: ${{ secrets.CINEJOY_KEY_ALIAS }}
          CINEJOY_KEY_PASSWORD: ${{ secrets.CINEJOY_KEY_PASSWORD }}

      - name: Name the APK CineDownloader-<version>.apk
        # The release asset is named after the app and version instead of the
        # default app-release.apk / app-debug.apk.
        run: |
          apk=$(find app/build/outputs/apk -name 'app-*.apk' | head -1)
          test -n "$apk"
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$apk" "$RUNNER_TEMP/dist/CineDownloader-$ver.apk"
          ls -la "$RUNNER_TEMP/dist"

      - name: Write the "What's new" notes
        # The app shows the release body as "What's new" in its update popup and
        # Settings, so build it from the commit subjects since the last tag
        # instead of GitHub's compare-link default.
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## What's new in ${GITHUB_REF_NAME#v}"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty=format:'- %s' "$prev..$GITHUB_REF_NAME"
            else
              git log --no-merges --pretty=format:'- %s' -20
            fi
            echo
          } > "$RUNNER_TEMP/notes.md"
          # Also ship the notes as an asset: the app's rate-limit fallback reads
          # it straight from the release instead of the API's body field.
          cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/dist/whatsnew.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Attach APK to GitHub Release
        # NOTE: `uses:` steps ignore defaults.run.working-directory, so this
        # path is repo-root-relative (unlike the `run:` steps above).
        uses: softprops/action-gh-release@v2
        with:
          name: Cine Downloader ${{ github.ref_name }}
          files: |
            ${{ runner.temp }}/dist/CineDownloader-*.apk
            ${{ runner.temp }}/dist/whatsnew.md
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/notes.md
